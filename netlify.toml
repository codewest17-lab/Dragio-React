[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/avatars/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Vite fingerprints its JS/CSS output filenames (e.g. index-a1b2c3.js), so
# these ARE safe to cache aggressively — a content change gets a new
# filename automatically, unlike the old hand-written static site where
# this exact setting caused the caching bug documented in the other repo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback: React Router handles routing client-side, so every path
# needs to resolve to index.html rather than a real file on disk.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
